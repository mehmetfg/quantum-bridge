name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Arka uc testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: uv kurulumu
        uses: astral-sh/setup-uv@v3

      - name: Bagimliliklar
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Testler
        run: pytest -q

  frontend:
    name: On yuz derlemesi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: pnpm kurulumu
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Bagimliliklar
        run: pnpm install --frozen-lockfile

      - name: Tur denetimi ve derleme
        run: pnpm build
